services:
  # ============================================
  # Приложение
  # ============================================
  app:
    build: .
    container_name: ${PROJECT_NAME:-postman-runner}-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3001}:3000"
    environment:
      - PORT=3000
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-admin}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:-admin}
    volumes:
      - app_data:/app/collections
      - app_envs:/app/environments
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  app_data:
  app_envs:

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔐 Вход</title>
  <style>
    :root {
      --primary-gradient: radial-gradient(1200px 600px at 20% -10%, rgba(59,130,246,.35), transparent 60%),
        radial-gradient(900px 500px at 90% 0%, rgba(16,185,129,.25), transparent 55%),
        linear-gradient(135deg, #0b1024 0%, #0b3a4b 55%, #0b5f69 100%);
      --panel-bg: rgba(2, 6, 23, 0.65);
      --glass-border: rgba(148, 163, 184, 0.25);
      --text-primary: #f8fafc;
      --text-muted: rgba(226, 232, 240, 0.6);
      --shadow-lg: 0 30px 80px rgba(2, 6, 23, 0.45);
      --border-radius: 18px;
      --transition: all 0.25s ease;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary-gradient);
      padding: 24px;
      color: var(--text-primary);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(600px 300px at 15% 15%, rgba(255,255,255,.08), transparent 65%),
        radial-gradient(500px 280px at 85% 10%, rgba(255,255,255,.06), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--panel-bg);
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      padding: 32px;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(14px);
      position: relative;
      z-index: 1;
    }
    .logo {
      display: block;
      margin: 0 auto 16px;
      width: 140px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.3));
    }
    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,.35);
      background: rgba(15,23,42,.6);
      color: var(--text-primary);
      margin-bottom: 16px;
      transition: var(--transition);
    }
    input:focus {
      outline: none;
      border-color: #60a5fa;
      background: rgba(15,23,42,.8);
      box-shadow: 0 0 0 4px rgba(59,130,246,.2);
    }
    button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #fff;
      cursor: pointer;
      transition: var(--transition);
    }
    button:hover { transform: translateY(-1px); }
    .error {
      margin-top: 12px;
      color: #fca5a5;
      font-size: 14px;
      min-height: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="Service_Logo_full_.svg" alt="Logo" />
    <h1>Вход в Postman Runner</h1>
    <div class="subtitle">Введите логин и пароль для доступа</div>
    <form id="loginForm">
      <label for="username">Логин</label>
      <input id="username" name="username" type="text" autocomplete="username" required />
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit" id="loginBtn">Войти</button>
      <div class="error" id="error"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      loginBtn.disabled = true;
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        if (res.ok) {
          window.location.href = '/';
          return;
        }
        errorEl.textContent = 'Неверный логин или пароль';
      } catch (_) {
        errorEl.textContent = 'Ошибка соединения с сервером';
      } finally {
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔐 Вход</title>
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #03197a 0%, #0694a7 100%);
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --text-primary: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --shadow-lg: 0 25px 50px rgba(0, 0, 0, 0.2);
      --border-radius: 16px;
      --transition: all 0.3s ease;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary-gradient);
      padding: 20px;
      color: var(--text-primary);
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(14px);
    }
    .logo {
      display: block;
      margin: 0 auto 16px;
      width: 140px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.3));
    }
    h1 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      color: #fff;
      margin-bottom: 16px;
      transition: var(--transition);
    }
    input:focus {
      outline: none;
      border-color: #60a5fa;
      background: rgba(255,255,255,.15);
    }
    button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      background: linear-gradient(45deg, #1d4ed8, #1e40af);
      color: #fff;
      cursor: pointer;
      transition: var(--transition);
    }
    button:hover { transform: translateY(-1px); }
    .error {
      margin-top: 12px;
      color: #fca5a5;
      font-size: 14px;
      min-height: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="Service_Logo_full_.svg" alt="Logo" />
    <h1>Вход в Postman Runner</h1>
    <form id="loginForm">
      <label for="username">Логин</label>
      <input id="username" name="username" type="text" autocomplete="username" required />
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit" id="loginBtn">Войти</button>
      <div class="error" id="error"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      loginBtn.disabled = true;
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        if (res.ok) {
          window.location.href = '/';
          return;
        }
        errorEl.textContent = 'Неверный логин или пароль';
      } catch (_) {
        errorEl.textContent = 'Ошибка соединения с сервером';
      } finally {
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
